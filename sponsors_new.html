<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsors | Weasel Phlipot / Garke Racing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .sponsor-frame {
      background: linear-gradient(145deg, #1f2937, #111827);
      border: 12px solid transparent;
      border-image: linear-gradient(to bottom, #facc15, #d97706) 1;
      box-shadow: 0 0 40px rgba(234, 179, 8, 0.5);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .sponsor-frame:hover {
      transform: translateY(-12px) scale(1.03);
      box-shadow: 0 30px 60px -12px rgb(234 179 8);
    }
    .gold-oval {
      background: linear-gradient(90deg, #ca8a04, #fbbf24, #ca8a04);
      color: #451a03;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      font-weight: 900;
      letter-spacing: 2px;
    }
    .sponsor-name {
      font-size: 1.8rem;
      line-height: 1.1;
      font-weight: 900;
      text-shadow: 3px 3px 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans">

  <!-- NAV (same as before) -->
  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-md z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center text-2xl font-black">P</div>
        <h1 class="text-xl md:text-2xl font-black tracking-tighter">WEASEL PHLIPOT / GARKE RACING</h1>
      </div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html" class="hover:text-red-500">Home</a>
        <a href="about.html" class="hover:text-red-500">About</a>
        <a href="schedule.html" class="hover:text-red-500">Schedule</a>
        <a href="sponsors.html" class="text-red-500 font-semibold">Sponsors</a>
        <a href="gallery.html" class="hover:text-red-500">Gallery</a>
        <a href="news.html" class="hover:text-red-500">News</a>
        <a href="contact.html" class="hover:text-red-500">Contact</a>
      </div>
      <button id="hamburger" class="md:hidden text-3xl p-2">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <div id="mobileMenu" class="hidden md:hidden bg-zinc-900 border-t border-zinc-800 py-8">
      <div class="flex flex-col items-center gap-8 text-xl">
        <a href="index.html" class="mobile-link">Home</a>
        <a href="about.html" class="mobile-link">About</a>
        <a href="schedule.html" class="mobile-link">Schedule</a>
        <a href="sponsors.html" class="mobile-link">Sponsors</a>
        <a href="gallery.html" class="mobile-link">Gallery</a>
        <a href="news.html" class="mobile-link">News</a>
        <a href="contact.html" class="mobile-link">Contact</a>
      </div>
    </div>
  </nav>

  <div class="pt-24 pb-16 max-w-7xl mx-auto px-6">
    <h1 class="text-5xl font-black text-center mb-4">Our Sponsors</h1>
    <p class="text-center text-zinc-400 text-lg mb-16">Thank you to everyone who supports Phlipot Racing!</p>

    <div id="sponsors-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
      <!-- Dynamically generated -->
    </div>
  </div>

  <script>
    const repoOwner = "Slither95";
    const repoName = "phlipotracing";
    const sponsorsFolder = "images/sponsors";

    async function loadSponsors() {
      const container = document.getElementById('sponsors-container');
      container.innerHTML = '<p class="col-span-full text-center text-zinc-400 py-20 text-xl">Loading sponsors...</p>';

      try {
        const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${sponsorsFolder}`);
        if (!response.ok) throw new Error();

        const files = await response.json();
        const sponsorFiles = files.filter(file => 
          file.type === "file" && /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(file.name)
        );

        container.innerHTML = '';

        if (sponsorFiles.length === 0) {
          container.innerHTML = `<div class="col-span-full text-center py-20"><p class="text-6xl mb-6">🏁</p><h3 class="text-4xl font-bold">Coming Soon!</h3></div>`;
          return;
        }

        sponsorFiles.forEach(file => {
          const displayName = file.name
            .replace(/\.(jpg|jpeg|png|gif|webp|svg)$/i, '')
            .replace(/-/g, ' ')
            .replace(/_/g, ' ')
            .trim()
            .toUpperCase();

          const div = document.createElement('div');
          div.className = 'sponsor-frame rounded-3xl overflow-hidden';
          div.innerHTML = `
            <div class="aspect-[5/4] flex items-center justify-center p-8 bg-gradient-to-br from-zinc-900 to-black relative">
              <div class="text-center w-full px-6">
                <div class="sponsor-name text-amber-200 leading-tight">
                  ${displayName}
                </div>
              </div>
            </div>
            <!-- Golden Oval -->
            <div class="gold-oval mx-auto -mt-6 relative z-10 w-48 h-20 flex items-center justify-center rounded-full border-4 border-amber-300 shadow-xl">
              <span class="text-xl font-black tracking-widest">SPONSOR</span>
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = `<div class="col-span-full text-center py-20"><p class="text-6xl mb-6">🏁</p><h3 class="text-4xl font-bold">Coming Soon!</h3></div>`;
      }
    }

    window.onload = loadSponsors;

    // Mobile Menu (same as before)
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const icon = hamburger.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-xmark');
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        const icon = hamburger.querySelector('i');
        icon.classList.add('fa-bars');
        icon.classList.remove('fa-xmark');
      });
    });
  </script>
</body>
</html>
